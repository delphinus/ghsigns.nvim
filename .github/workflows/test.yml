name: Tests

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Clone plenary.nvim
        run: |
          git clone --depth=1 https://github.com/nvim-lua/plenary.nvim /tmp/plenary.nvim

      - name: Clone md-render.nvim
        run: |
          git clone --depth=1 https://github.com/delphinus/md-render.nvim /tmp/md-render.nvim

      - name: Run tests
        run: |
          export PLENARY_DIR=/tmp/plenary.nvim
          export MD_RENDER_DIR=/tmp/md-render.nvim
          make test
